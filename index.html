function updateEnemyAI(dt){

  const delta=player.position.clone().sub(e.g.position);delta.y=0;
  const distance=delta.length();
  const pursuing=distance<13||e.alert>0;
  if(distance>21)e.alert=0;
  if(pursuing&&distance<18)e.alert=4;
  e.alert=Math.max(0,e.alert-dt);
  let destination;
  if(pursuing&&distance<18){e.state='chase';destination=player.position}
  else{e.state='patrol';e.phase+=dt*.35;destination=new THREE.Vector3(e.home.x+Math.sin(e.phase)*3,0,e.home.z+Math.cos(e.phase*.8)*2)}
  const dir=destination.clone().sub(e.g.position);dir.y=0;const len=dir.length();

   const nx=e.g.position.x+dir.x*speed*dt,nz=e.g.position.z+dir.z*speed*dt;

   if(!blockedOutside(e.g.position.x,nz))e.g.position.z=nz;
   e.g.rotation.y=Math.atan2(-dir.x,-dir.z);

   for(let i=0;i<e.legs.length;i++)e.legs[i].rotation.x=Math.sin(e.step+(i%3)*Math.PI)*.25;

   hurtRowan(9+Math.round(e.difficulty*3));

 }
 refreshHealth();
}

const clock=new THREE.Clock(),target=new THREE.Vector3();let saveTime=0;function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05);mapTimer+=dt;updateWorldClock(dt);updateExtraction(dt);updateVillagerRoutines(dt);updateEnemyAI(dt);if(mapTimer>.12){drawMinimap();mapTimer=0}if(!open&&!extraction){const x=Math.abs(joyX)>.08?joyX:0,y=Math.abs(joyY)>.08?-joyY:0,magnitude=Math.min(1,Math.hypot(x,y));if(magnitude>.05){// Joystick forward always follows the direction the camera LOOKS, never the direction behind it. Camera swipe alone never moves Rowan.
